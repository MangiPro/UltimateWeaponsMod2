# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric Properties
# Aktueller Stand fuer Minecraft 1.21.11 (Stand: September 2026).
# Falls Fabric zwischenzeitlich neuere Versionen fuer 1.21.11 hat, einfach
# loader_version / fabric_version / yarn_mappings auf https://fabricmc.net/develop
